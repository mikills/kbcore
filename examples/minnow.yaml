# Full minnow deployment example. Every field is set explicitly so the file
# can be diffed against docs/configuration.md and used as a starting point
# for production configs.
#
# Secrets (Mongo URI) are referenced via the dollar-sign VAR syntax.
# Set them in the process environment, not inline.
#
# Run: MINNOW_MONGO_URI=mongodb://localhost:27017 \
#      MINNOW_CONFIG=./examples/minnow.yaml ./minnow

http:
  address: 127.0.0.1:8080
  read_header_timeout: 5s
  shutdown_timeout: 5s

storage:
  blob:
    kind: local
    root: ./.temp/fixtures
  cache:
    dir: ./.temp/cache
    max_bytes: 0          # 0 = unbounded
    entry_ttl: 0s         # 0 = no TTL
    evict_interval: 30s

format:
  kind: duckdb
  duckdb:
    memory_limit: 128MB
    extension_dir: ./extensions
    offline: false

# Default embedder is `local` (deterministic, zero-dependency). To use native
# Ollama, set `provider: ollama` and uncomment the `ollama` block below. To use
# OpenAI-compatible APIs (including Ollama /v1), set `provider:
# openai_compatible` and uncomment the `openai_compatible` block. The selected
# provider's block is required.
embedder:
  provider: local
  local:
    dim: 384
  # ollama:
  #   url: http://localhost:11434
  #   model: all-minilm
  # openai_compatible:
  #   base_url: http://localhost:11434/v1
  #   model: nomic-embed-text
  #   token: ollama
  #   dimensions: 0

graph:
  enabled: false
  url: http://localhost:11434
  model: llama3
  parallelism: 2

mongo:
  uri: ${MINNOW_MONGO_URI}
  database: minnow
  collections:
    manifests: manifests
    events: kb_events
    inbox: kb_event_inbox
    media: media

scheduler:
  enabled: true
  tick_interval: 1m
  disabled_jobs: []

workers:
  defaults:
    max_attempts: 5
    poll_interval: 500ms
    visibility_timeout: 5m
  document_upsert:
    concurrency: 4
  document_chunked:
    concurrency: 4
  document_publish:
    concurrency: 2
  media_upload:
    concurrency: 2

media:
  enabled: true
  max_bytes: 10485760     # 10 MiB
  content_type_allowlist: []   # empty = accept all
  pending_ttl: 24h
  tombstone_grace: 1h
  upload_completion_ttl: 15m

sharding:
  shard_trigger_bytes: 67108864          # 64 MiB
  shard_trigger_vector_rows: 150000
  target_shard_bytes: 33554432           # 32 MiB
  max_vector_rows_per_shard: 75000
  query_shard_fanout: 4                  # <= 64
  query_shard_fanout_adaptive_max: 6     # >= query_shard_fanout, <= 64
  query_shard_parallelism: 4
  query_shard_local_topk_multiplier: 2   # <= 16
  small_kb_max_shards: 2
  compaction_enabled: true
  compaction_min_shard_count: 8
  compaction_tombstone_ratio: 0.20       # (0, 1]

code_index:
  include:
    - "**/*.go"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.py"
    - "**/*.rs"
    - "**/*.md"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.json"
    - "**/Dockerfile"
  exclude:
    - .git/**
    - .minnow/**
    - node_modules/**
    - vendor/**
    - "**/vendor/**"
    - dist/**
    - build/**
    - coverage/**
    - fixtures/**
    - "**/fixtures/**"
    - data/**
    - "**/data/**"
    - .next/**
    - .turbo/**
    - target/**
    - extensions/**
    - examples/extensions/**
    - "**/*.duckdb"
    - "**/*.duckdb_extension"
    - "**/*.parquet"
    - "**/*.min.js"
    - "**/*.min.css"
    - "**/*.map"
    - "*.lock"
    - .gitignore
  max_file_bytes: 1048576
  chunk_size: 1200
  chunk_overlap: 120
  include_untracked: false
  embed_batch_size: 32
  max_batch_bytes: 262144
  throttle: 100ms
  max_heap_bytes: 1073741824
  max_rss_bytes: 1073741824
  large_repo_files: 1000
  require_confirm: false

mcp:
  enabled: true
  transports: [http, stdio]
  http_path: /mcp
  read_only: false
  allow_indexing: true
  allow_sync_indexing: true
  allow_destructive: false
  allow_admin: false
  default_sync_timeout: 30s
  max_sync_timeout: 2m
  http_json_response: false
  http_stateless: true
