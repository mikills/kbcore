http:
  address: 0.0.0.0:8080
  read_header_timeout: 5s
  shutdown_timeout: 15s

storage:
  blob:
    kind: local
    root: /var/lib/minnow/blobs
  cache:
    dir: /var/lib/minnow/cache
    max_bytes: 536870912 # 512 MiB
    entry_ttl: 30m
    warm_shards: 0
    evict_interval: 30s

format:
  kind: duckdb
  duckdb:
    memory_limit: 128MB
    extension_dir: /opt/minnow/extensions
    offline: true

embedder:
  provider: openai_compatible
  openai_compatible:
    base_url: https://api.openai.com/v1
    model: text-embedding-3-small
    token: ${OPENAI_API_KEY}
    dimensions: 0

scheduler:
  enabled: true
  tick_interval: 1m

workers:
  defaults:
    max_attempts: 5
    poll_interval: 500ms
    visibility_timeout: 5m
  document_upsert:
    concurrency: 2
  document_chunked:
    concurrency: 2
  document_publish:
    concurrency: 1
  media_upload:
    concurrency: 1

sharding:
  query_shard_fanout: 2
  query_shard_fanout_adaptive_max: 2
  query_shard_parallelism: 1

mcp:
  enabled: true
  transports: [http]
  http_path: /mcp
  read_only: false
  allow_indexing: true
  allow_sync_indexing: true
  allow_destructive: false
  allow_admin: false
  http_stateless: true
