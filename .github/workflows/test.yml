name: Test

on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "codeindex/v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOWORK: off
        run: go build ./...

      - name: Build codeindex
        run: go build -o /tmp/minnow-codeindex ./codeindex

      - name: Check the duplicated codeindex packages match
        run: diff -r codeindex/indexer kb/codeindex

      - name: Validate deployment configuration
        run: |
          OPENAI_API_KEY=test go run . config validate deploy/docker/minnow.yaml
          OPENAI_API_KEY=test go run . config validate deploy/fly/minnow.yaml
          OPENAI_API_KEY=test docker compose config --quiet

      - name: Test
        run: go test ./... -count=1 -tags=long

      - name: Test codeindex
        run: go test ./codeindex/...

      - name: Build, install, and test codeindex independently
        working-directory: codeindex
        env:
          GOWORK: off
        run: |
          go test ./...
          go build ./...
          go install .

      - name: Test codeindex outside workspace on release tags
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: codeindex
        env:
          GOWORK: off
        run: go test ./...

  container:
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/codeindex/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: runtime
          load: true
          tags: minnow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Fly image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: fly
          load: true
          tags: minnow:fly-ci
          cache-from: type=gha

      - name: Smoke-test runtime and Fly authentication
        env:
          OPENAI_API_KEY: test
          MINNOW_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f minnow-runtime-ci minnow-fly-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name minnow-runtime-ci -e OPENAI_API_KEY \
            -p 127.0.0.1:18080:8080 minnow:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          docker rm -f minnow-runtime-ci

          docker run -d --name minnow-fly-ci -e OPENAI_API_KEY -e MINNOW_TOKEN \
            -p 127.0.0.1:18081:8080 minnow:fly-ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/healthz && break
            sleep 1
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer attacker' http://127.0.0.1:18081/mcp)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $MINNOW_TOKEN" http://127.0.0.1:18081/mcp)" != 401

  publish-container:
    needs: [test, container]
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/codeindex/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
