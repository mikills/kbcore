name: Test

on:
  push:
    branches:
      - main
      - "bench/**"
      - "feat/**"
      - "fix/**"
    tags:
      - "v*"
      - "codeindex/v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOWORK: off
        run: go build ./...

      - name: Build codeindex
        run: go build -o /tmp/minnow-codeindex ./codeindex

      - name: Validate deployment configuration
        run: |
          OPENAI_API_KEY=test go run . config validate deploy/docker/minnow.yaml
          OPENAI_API_KEY=test go run . config validate deploy/fly/minnow.yaml
          go run . config validate deploy/docker/minnow.ollama.yaml
          docker compose config --quiet
          MINNOW_EMBEDDER=openai OPENAI_API_KEY=test docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
          sh -n install.sh

      - name: Test
        run: go test ./... -count=1 -tags=long

      - name: Test codeindex
        run: go test ./codeindex/...

      - name: Build, install, and test codeindex independently
        working-directory: codeindex
        env:
          GOWORK: off
        run: |
          go test ./...
          go build ./...
          go install .

      - name: Test codeindex outside workspace on release tags
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: codeindex
        env:
          GOWORK: off
        run: go test ./...

  cgroup:
    name: memory governor on a real cgroup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the runner has cgroup v2
        run: |
          test -f /sys/fs/cgroup/cgroup.controllers
          grep -q memory /sys/fs/cgroup/cgroup.controllers

      - name: Build the test binary
        run: go test -c -o /tmp/memlimit.test ./internal/memlimit/

      # The package's kernel-facing paths cannot run on a developer machine, so
      # this is the only place memory.high, epoll and the working set are ever
      # executed. A cgroup with a real limit is what makes them meaningful.
      - name: Run inside a limited cgroup
        run: |
          sudo mkdir -p /sys/fs/cgroup/minnow-test
          echo "+memory" | sudo tee /sys/fs/cgroup/cgroup.subtree_control > /dev/null
          echo $((2 * 1024 * 1024 * 1024)) | sudo tee /sys/fs/cgroup/minnow-test/memory.max > /dev/null
          echo max | sudo tee /sys/fs/cgroup/minnow-test/memory.high > /dev/null
          sudo sh -c 'echo $$ > /sys/fs/cgroup/minnow-test/cgroup.procs; \
            exec env MINNOW_CGROUP_IT=1 /tmp/memlimit.test -test.v -test.count=1 -test.run TestCgroupIntegration'

      - name: Confirm memory.high was put back
        if: always()
        run: |
          value=$(sudo cat /sys/fs/cgroup/minnow-test/memory.high 2>/dev/null || echo max)
          echo "memory.high after the run: $value"
          test "$value" = "max"

  container:
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/codeindex/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: runtime
          load: true
          tags: minnow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Fly image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: fly
          load: true
          tags: minnow:fly-ci
          cache-from: type=gha

      - name: Smoke-test runtime and Fly authentication
        env:
          OPENAI_API_KEY: test
          MINNOW_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f minnow-runtime-ci minnow-ollama-ci minnow-fly-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name minnow-ollama-ci \
            -e MINNOW_CONFIG=/etc/minnow/minnow.ollama.yaml \
            -p 127.0.0.1:18082:8080 minnow:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18082/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18082/healthz
          docker rm -f minnow-ollama-ci

          docker run -d --name minnow-runtime-ci -e OPENAI_API_KEY \
            -p 127.0.0.1:18080:8080 minnow:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          docker rm -f minnow-runtime-ci

          docker run -d --name minnow-fly-ci -e OPENAI_API_KEY -e MINNOW_TOKEN \
            -p 127.0.0.1:18081:8080 minnow:fly-ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/healthz && break
            sleep 1
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer attacker' http://127.0.0.1:18081/mcp)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $MINNOW_TOKEN" http://127.0.0.1:18081/mcp)" != 401

  publish-container:
    needs: [test, container]
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/codeindex/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release-codeindex:
    needs: test
    if: startsWith(github.ref, 'refs/tags/codeindex/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        working-directory: codeindex
        env:
          GOWORK: off
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#codeindex/}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.releaseVersion=$version" \
              -o "dist/codeindex" .
            tar -czf "dist/codeindex_${version}_${os}_${arch}.tar.gz" -C dist codeindex
            rm dist/codeindex
          done
          cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" codeindex/dist/* --clobber
