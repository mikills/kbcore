name: Test

on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "codeindex/v*"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOWORK: off
        run: go build ./...

      - name: Build codeindex
        run: go build -o /tmp/minnow-codeindex ./codeindex

      - name: Test
        run: go test ./... -count=1 -tags=long

      - name: Test codeindex
        run: go test ./codeindex/...

      - name: Build, install, and test codeindex independently
        working-directory: codeindex
        env:
          GOWORK: off
        run: |
          go test ./...
          go build ./...
          go install .

      - name: Test codeindex outside workspace on release tags
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: codeindex
        env:
          GOWORK: off
        run: go test ./...
